<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WeChat 小程序 DevTools 控制台</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e6e9ef;
          --dim:#8b93a3; --green:#3ddc84; --red:#ff5c5c; --blue:#5aa2ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"SF Pro Text",sans-serif; padding:24px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns: 1fr 380px; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:14px; }
  .panel h2 { font-size:13px; color:var(--dim); font-weight:600;
              margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:500; padding:6px 8px;
       border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); }
  tr:hover td { background:#1f232c; }
  tr.prewarm td, tr.preload td { opacity:.45; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; }
  .tag.main { background:#1d3325; color:var(--green); }
  .tag.renderer { background:#1b2a3d; color:var(--blue); }
  .tag.miniapp { background:#3d2a1b; color:#ffb454; }
  .tag.prewarm { background:#222; color:#666; }
  .tag.preload { background:#222; color:#666; }
  .tag.child { background:#2b2b2b; color:var(--dim); }
  .ok { color:var(--green); } .bad { color:var(--red); }
  button { background:#242936; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:4px 12px; font-size:12px; cursor:pointer; }
  button:hover { background:#2e3546; }
  button.primary { background:#1d4ed3; border-color:#2563eb; }
  .log { font:11px/1.6 ui-monospace,monospace; color:#a8b3c7;
         max-height:420px; overflow-y:auto; white-space:pre-wrap; }
  .log .pid { color:var(--dim); }
  .bar { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .dot.off { background:var(--red); }
  #cdp { font:12px ui-monospace,monospace; color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
<h1>WeChat 小程序 DevTools 控制台</h1>
<div class="sub">微信 4.1.13 (AppEx 2.5.6) · 守护注入 · CDP 探测</div>

<div class="bar">
  <span class="dot" id="alive"></span><span id="summary" style="font-size:12px"></span>
  <span style="flex:1"></span>
  <button class="primary" onclick="injectAll()">一键注入全部</button>
  <button onclick="probe()">探测 CDP 端口</button>
</div>

<div class="grid">
  <div class="panel">
    <h2>WeChatAppEx 进程</h2>
    <table>
      <thead><tr><th>PID</th><th>类型</th><th>appid</th><th>CPU</th><th>内存</th><th>开关</th><th>Hook</th><th></th></tr></thead>
      <tbody id="procs"></tbody>
    </table>
    <div id="cdp"></div>
  </div>
  <div class="panel">
    <h2>Hook 消息</h2>
    <div class="log" id="log">等待注入…</div>
  </div>
</div>

<script>
let state = {procs: [], injected: [], messages: []};

async function refresh() {
  try {
    const r = await fetch('/api/status');
    state = await r.json();
    render();
    document.getElementById('alive').className = 'dot';
  } catch {
    document.getElementById('alive').className = 'dot off';
  }
}

function render() {
  const tb = document.getElementById('procs');
  tb.innerHTML = state.procs.map(p => {
    const hooked = state.injected.includes(p.pid);
    return `<tr class="${p.kind}">
      <td>${p.pid}</td>
      <td><span class="tag ${p.kind}">${p.kind === 'miniapp' ? '小程序' : (p.kind === 'prewarm' || p.kind === 'preload') ? '预热' : p.kind}</span></td>
      <td style="font-family:monospace;font-size:11px">${p.appid || ''}</td>
      <td>${p.cpu}%</td>
      <td>${p.rss_mb}M</td>
      <td>${p.armed ? '<span class="ok">✓</span>' : '—'}</td>
      <td>${hooked ? '<span class="ok">已注入</span>' : '—'}</td>
      <td>${['main','miniapp'].includes(p.kind) ? `<button onclick="inject(${p.pid})">注入</button>` : ''}</td>
    </tr>`;
  }).join('');
  document.getElementById('summary').textContent =
    `${state.procs.length} 进程 · ${state.injected.length} 已注入`;
  document.getElementById('log').innerHTML = state.messages.slice().reverse().map(m =>
    `<span class="pid">[${m.t}][${m.pid}]</span> ${escapeHtml(m.msg)}`).join('\n');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function inject(pid) {
  await fetch('/api/inject', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({pid})});
  refresh();
}
async function injectAll() {
  await fetch('/api/inject_all', {method:'POST'});
  refresh();
}
async function probe() {
  const r = await fetch('/api/probe');
  const d = await r.json();
  document.getElementById('cdp').textContent =
    d.cdp.length ? 'CDP: ' + JSON.stringify(d.cdp) : 'CDP: 未发现调试端口';
}

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
