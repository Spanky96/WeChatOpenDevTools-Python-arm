<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微信小程序 DevTools</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e6e9ef;
          --dim:#8b93a3; --green:#3ddc84; --red:#ff5c5c; --blue:#5aa2ff; --amber:#ffb454; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"SF Pro Text",sans-serif; padding:20px 24px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .status-dot { width:8px; height:8px; border-radius:50%; margin-right:4px; }
  .on { background:var(--green); } .off { background:var(--red); }
  .tag { font-size:11px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .panel h2 { font-size:13px; color:var(--dim); font-weight:600; text-transform:uppercase;
              letter-spacing:.05em; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:500; padding:6px 8px;
       border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); }
  tr:hover td { background:#1f232c; }
  button { background:#242936; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:4px 14px; font-size:12px; cursor:pointer; }
  button:hover { background:#2e3546; }
  button.devtools { background:#1d4ed3; border-color:#2563eb; font-weight:600; }
  button.devtools:hover { background:#2563eb; }
  .guide { color:var(--dim); font-size:13px; line-height:1.8; }
  .guide b { color:var(--fg); }
  .guide .step { color:var(--amber); font-weight:600; margin-right:4px; }
  .empty { color:var(--dim); text-align:center; padding:24px; font-size:13px; }
</style>
</head>
<body>
<h1>微信小程序 DevTools 控制台</h1>
<div class="sub">任意小程序 · Chrome DevTools · 一键启动</div>

<div class="row">
  <span class="status-dot" id="dot-sniper"></span><span class="tag" id="t-sniper">Sniper</span>
  <span class="status-dot" id="dot-gateway"></span><span class="tag" id="t-gateway">Gateway</span>
  <span class="status-dot" id="dot-bridge"></span><span class="tag" id="t-bridge">调试桥</span>
  <span style="flex:1"></span>
  <button onclick="refresh()">刷新</button>
</div>

<div class="panel" id="guide-panel">
  <h2>快速开始</h2>
  <div class="guide" id="guide">
    <span class="step">①</span> 打开<b>微信开发者工具</b>，选择任意有权限的项目，点击<b>真机调试</b><br>
    <span class="step">②</span> 等待调试面板出现后，回到此页面点击<b>刷新</b><br>
    <span class="step">③</span> 在微信中打开你要调试的<b>任意小程序</b><br>
    <span class="step">④</span> 下方列表中找到它，点击<b>DevTools</b>按钮
  </div>
</div>

<div class="panel">
  <h2>可调试的小程序 / 页面</h2>
  <table>
    <thead><tr><th>AppID</th><th>URL</th><th></th></tr></thead>
    <tbody id="targets"></tbody>
  </table>
  <div class="empty" id="no-targets" style="display:none">
    暂无可调试目标 — 请先完成上方步骤
  </div>
</div>

<script>
let state = {};

async function refresh() {
  try {
    const r = await fetch('/api/status');
    state = await r.json();
    render();
  } catch(e) {
    console.error(e);
  }
}

function render() {
  const dot = (id, on) => {
    const el = document.getElementById(id);
    if (el) el.className = 'status-dot ' + (on ? 'on' : 'off');
  };
  dot('dot-sniper', state.sniper);
  dot('dot-gateway', state.gateway);
  dot('dot-bridge', !!state.bridge);
  document.getElementById('t-sniper').textContent = 'Sniper' + (state.sniper ? ' ✓' : ' ✗');
  document.getElementById('t-gateway').textContent = 'Gateway' + (state.gateway ? ' ✓' : ' ✗');
  document.getElementById('t-bridge').textContent = state.bridge ? '桥 :' + state.bridge : '桥 ✗';

  const tb = document.getElementById('targets');
  const targets = state.targets || [];
  document.getElementById('no-targets').style.display = targets.length ? 'none' : 'block';
  tb.innerHTML = targets.map(t => `<tr>
    <td style="font-family:monospace;font-size:12px;color:${t.appid === 'H5' ? 'var(--amber)' : 'var(--green)'}">${t.appid}</td>
    <td style="font-size:12px;color:var(--dim);max-width:400px;overflow:hidden;text-overflow:ellipsis">${t.url}</td>
    <td><button class="devtools" onclick="openDevtools('${t.targetId}')">DevTools</button></td>
  </tr>`).join('');

  // hide guide when bridge is up and targets exist
  if (state.bridge && targets.length > 0) {
    document.getElementById('guide-panel').style.display = 'none';
  } else {
    document.getElementById('guide-panel').style.display = '';
  }
}

async function openDevtools(tid) {
  await fetch('/api/open_devtools?target_id=' + tid);
}

setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
