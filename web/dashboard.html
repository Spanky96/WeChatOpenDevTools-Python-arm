<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>微信 DevTools</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script defer src="/vendor/lucide.min.js"></script>
  <script defer src="/vendor/beautify.min.js"></script>
  <script defer src="/debug_model.js"></script>
  <script defer src="/dashboard.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon"><i data-lucide="terminal-square"></i></span><h1>微信 DevTools</h1><span class="local-tag">LOCAL</span></div>
    <div class="services" aria-label="服务状态">
      <span class="service" id="service-sniper" title="Sniper"><b class="dot"></b>Sniper</span>
      <span class="service" id="service-gateway" title="Gateway"><b class="dot"></b>Gateway</span>
      <span class="service" id="service-sess" title="Service"><b class="dot"></b>Service</span>
      <span class="service" id="service-h5" title="网页调试"><b class="dot"></b>H5</span>
    </div>
    <button class="icon-btn" id="settings-open" aria-label="捕获设置" data-tip="捕获设置"><i data-lucide="sliders-horizontal"></i></button>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-heading"><span>调试目标</span><span id="app-count" class="pill">0</span><button class="icon-btn small" id="refresh-status" aria-label="刷新状态" data-tip="刷新状态"><i data-lucide="refresh-cw"></i></button></div>
      <div class="app-list" id="apps"><div class="empty">正在读取会话</div></div>
      <div class="h5-service-status"><i data-lucide="globe-2"></i><span id="h5-service-label">网页服务连接中</span><button class="icon-btn small" id="start-h5" aria-label="启动网页服务" data-tip="启动网页服务"><i data-lucide="play"></i></button></div>
      <div class="bridge-status"><div><b class="dot" id="bridge-dot"></b><strong id="bridge-title">调试桥</strong><span class="mono" id="bridge-port">--</span></div><span id="bridge-state">连接中</span><span id="sync-status">等待同步</span></div>
    </aside>
    <main class="workspace">
      <section class="session-header">
        <div class="session-title"><div class="eyebrow">当前会话</div><h2 id="selected-app">未选择小程序</h2><div class="session-meta"><span id="session-phase" class="status-pill">等待发现</span><span id="agent-version">Agent --</span><span id="last-event">尚无事件</span></div></div>
        <div class="session-actions"><button class="btn" id="retry-agent"><i data-lucide="rotate-cw"></i>重试连接</button><button class="btn primary" id="open-devtools"><i data-lucide="external-link"></i>DevTools</button></div>
      </section>
      <div class="notice hidden" id="session-notice" role="status"></div>
      <div class="paused hidden" id="paused-bar"><i data-lucide="pause"></i><strong>已暂停</strong><span id="paused-reason"></span><div class="debug-actions"><button class="icon-btn" data-debug="resume" aria-label="继续" data-tip="继续"><i data-lucide="play"></i></button><button class="icon-btn" data-debug="stepOver" aria-label="步过" data-tip="步过"><i data-lucide="corner-down-right"></i></button><button class="icon-btn" data-debug="stepInto" aria-label="步入" data-tip="步入"><i data-lucide="arrow-down-to-line"></i></button><button class="icon-btn" data-debug="stepOut" aria-label="步出" data-tip="步出"><i data-lucide="arrow-up-from-line"></i></button></div></div>
      <section class="h5-workspace" id="h5-workspace" aria-label="网页 DevTools" hidden>
        <div class="empty" id="h5-empty" role="status"><i data-lucide="unplug"></i><strong id="h5-empty-title">等待页面重新连接</strong><span id="h5-empty-reason"></span></div>
        <iframe id="h5-devtools" title="网页 Elements、Console 与 Network" allow="clipboard-write" hidden></iframe>
      </section>
      <nav class="tabs" role="tablist" aria-label="调试视图">
        <button class="tab active" data-tab="network" role="tab" aria-selected="true"><i data-lucide="network"></i>Network<span id="net-badge" class="tab-count">0</span></button>
        <button class="tab" data-tab="console" role="tab" aria-selected="false"><i data-lucide="terminal"></i>Console<span id="con-badge" class="tab-count">0</span></button>
        <button class="tab" id="storage-tab" data-tab="storage" role="tab" aria-selected="false"><i data-lucide="database"></i>Storage</button>
        <button class="tab" id="source-tab" data-tab="source" role="tab" aria-selected="false"><i data-lucide="file-code-2"></i>源码</button>
        <button class="tab" data-tab="diagnostics" role="tab" aria-selected="false"><i data-lucide="activity"></i>连接诊断</button>
      </nav>
      <section class="page active" id="page-network" role="tabpanel" aria-label="Network">
        <div class="toolbar"><label class="search"><i data-lucide="search"></i><input id="net-filter" placeholder="筛选 URL 或域名" aria-label="筛选 URL 或域名"></label><select id="net-method" aria-label="请求方法"><option value="">所有方法</option><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>PATCH</option><option>HEAD</option><option>OPTIONS</option></select><select id="net-state" aria-label="请求状态"><option value="">所有状态</option><option value="error">失败 / 4xx / 5xx</option><option value="pending">等待响应</option><option value="truncated">内容已截断</option></select><span class="toolbar-spacer"></span><span class="count" id="net-count">0 个请求</span><button class="icon-btn" id="export-network" aria-label="导出网络记录" data-tip="导出网络记录"><i data-lucide="download"></i></button><button class="icon-btn danger" id="clear-network" aria-label="清空网络记录" data-tip="清空网络记录"><i data-lucide="trash-2"></i></button></div>
        <div class="network-summary"><span><b id="summary-total">0</b> 请求</span><span class="error-text"><b id="summary-errors">0</b> 失败</span><span><b id="summary-size">0 B</b> 已捕获</span><span id="network-retention"></span></div>
        <div class="network-workspace" id="network-workspace"><div class="network-table"><table><thead><tr><th class="col-status">状态</th><th>请求 / 域名</th><th class="col-method">方法</th><th class="col-size">大小</th><th class="col-time">耗时</th></tr></thead><tbody id="net-rows"></tbody></table><div class="empty" id="net-empty"><i data-lucide="network"></i><strong>暂无请求</strong><span id="net-empty-label">等待捕获事件</span></div></div><aside class="request-detail hidden" id="net-detail"></aside></div>
      </section>
      <section class="page" id="page-console" role="tabpanel" aria-label="Console" hidden>
        <div class="toolbar"><label class="search"><i data-lucide="search"></i><input id="con-filter" placeholder="筛选日志" aria-label="筛选日志"></label><select id="con-level" aria-label="日志级别"><option value="">所有级别</option><option value="error">Error</option><option value="warn">Warning</option><option value="info">Info</option><option value="log">Log</option></select><label class="check"><input type="checkbox" id="con-follow" checked>自动滚动</label><span class="toolbar-spacer"></span><span class="count" id="con-count">0 条</span><button class="icon-btn" id="pause-console" aria-label="暂停显示" data-tip="暂停显示"><i data-lucide="pause"></i></button><button class="icon-btn" id="export-console" aria-label="导出日志" data-tip="导出日志"><i data-lucide="download"></i></button><button class="icon-btn danger" id="clear-console" aria-label="清空控制台" data-tip="清空控制台"><i data-lucide="trash-2"></i></button></div>
        <div id="console-scroll" class="console-scroll"><div class="empty">暂无日志</div></div>
        <form class="repl" id="repl-form"><i data-lucide="chevron-right"></i><input id="repl-in" autocomplete="off" spellcheck="false" placeholder="JavaScript 表达式" aria-label="JavaScript 表达式"><button class="icon-btn" type="submit" aria-label="执行表达式" data-tip="执行表达式"><i data-lucide="corner-down-left"></i></button></form>
      </section>
      <section class="page" id="page-storage" role="tabpanel" aria-label="Storage" hidden><div class="toolbar"><label class="search"><i data-lucide="search"></i><input id="storage-filter" placeholder="筛选 Key 或 Value" aria-label="筛选存储"></label><span id="st-info" class="count"></span><span class="toolbar-spacer"></span><button class="icon-btn" id="storage-refresh" aria-label="刷新存储" data-tip="刷新存储"><i data-lucide="refresh-cw"></i></button><button class="icon-btn" id="export-storage" aria-label="导出存储" data-tip="导出存储"><i data-lucide="download"></i></button></div><div class="table-scroll"><table class="storage-table"><thead><tr><th>Key</th><th>Value</th><th class="col-action"></th></tr></thead><tbody id="st-rows"></tbody></table><div class="empty" id="st-empty">暂无存储</div></div></section>
      <section class="page" id="page-source" role="tabpanel" aria-label="源码" hidden><div class="toolbar"><select id="src-file" aria-label="源码文件"><option value="">选择文件</option></select><input id="src-goto" type="number" min="1" placeholder="行号" aria-label="跳转行号"><div class="segmented"><button class="active" id="src-raw">原始</button><button id="src-format">格式化</button></div><span class="toolbar-spacer"></span><button class="icon-btn" id="source-copy" aria-label="复制源码" data-tip="复制源码"><i data-lucide="copy"></i></button><button class="icon-btn" id="source-download" aria-label="下载源码" data-tip="下载源码"><i data-lucide="download"></i></button></div><div class="source-info" id="src-info"></div><div class="source-scroll" id="src-scroll"><div class="empty">暂无源码</div></div></section>
      <section class="page" id="page-diagnostics" role="tabpanel" aria-label="连接诊断" hidden><div class="diagnostics"><h3>当前会话</h3><dl id="diagnostic-values"></dl><h3>捕获设置</h3><dl id="capture-values"></dl><h3>事件存储</h3><dl><dt>轮换大小</dt><dd>16 MiB / 文件，保留 3 份历史</dd><dt>读取方式</dt><dd>增量游标 / 分页续读</dd><dt>同步状态</dt><dd id="diagnostic-sync">等待同步</dd></dl></div></section>
      <footer class="workspace-footer"><span><b class="dot" id="connection-dot"></b><span id="connection-label">连接中</span></span><span id="footer-activity">--</span></footer>
    </main>
  </div>
  <dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><h2>捕获设置</h2><button class="icon-btn" type="button" id="settings-close" aria-label="关闭设置" data-tip="关闭"><i data-lucide="x"></i></button></div><label class="setting-field">请求体上限 <span>字符</span><input type="number" name="request_body" min="256" max="1048576" required></label><label class="setting-field">响应体上限 <span>字符</span><input type="number" name="response_body" min="256" max="1048576" required></label><label class="setting-field">请求头 / 响应头上限 <span>字符</span><input type="number" name="headers" min="256" max="1048576" required></label><div class="notice hidden" id="settings-error" role="alert"></div><div class="dialog-actions"><button class="btn" type="button" id="settings-reset">恢复默认</button><button class="btn primary" type="submit" id="settings-save">保存设置</button></div></form></dialog>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
